plugins {
    id 'com.android.application'
}

def tvLocal = new Properties()
def tvLocalFile = rootProject.file('local.properties')
if (tvLocalFile.exists()) tvLocalFile.withReader('UTF-8') { tvLocal.load(it) }
def tvValue = { String key -> tvLocal.getProperty(key, '').replace('"', '') }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        resValue 'string', 'movies_uri', tvValue('tv.movies_uri')
        resValue 'string', 'weather_city', tvValue('tv.weather_city')
        resValue 'string', 'weather_latitude', tvValue('tv.weather_latitude')
        resValue 'string', 'weather_longitude', tvValue('tv.weather_longitude')
        targetSdk 34
        versionCode 9
        versionName '3.0'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
